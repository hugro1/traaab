<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Laboratório de autenticação</title>

    <link rel="stylesheet" href="/styles.css">
  </head>

  <body>

    <main>

      <h1>Laboratório de autenticação</h1>

      <p id="status">
        A sessão ainda não foi consultada.
      </p>

      <div class="acoes">

        <a
          class="botao"
          href="/oauth/login/google"
        >
          Entrar com Google
        </a>

        <a
          class="botao"
          href="/oauth/login/github"
        >
          Entrar com GitHub
        </a>

        <a
          class="botao dashboard"
          href="/examples/dashboard.html"
        >
          Abrir Dashboard
        </a>

      </div>

      <form
        method="post"
        action="/oauth/logout"
      >
        <button type="submit">
          Sair
        </button>
      </form>

    </main>

    <script src="/app.js"></script>

  </body>
</html>
