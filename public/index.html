<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Desenho Assinado</title>
  <link rel="stylesheet" href="/style.css">
  <meta name="google-signin-client_id" content="SEU_GOOGLE_CLIENT_ID.apps.googleusercontent.com">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
  <main>
    <h1>Desenho Assinado</h1>
    <p>Entre com sua conta Google e gere uma figura assinada com o e-mail verificado dessa conta.</p>

    <section class="cartao">
      <h2>1. Autenticação</h2>
      <div id="g_id_onload"
           data-client_id="228730513855-bjjsbbimudhl4i8nrlvbeji6h9pt9v9v.apps.googleusercontent.com"
           data-callback="aoEntrarComGoogle"
           data-auto_prompt="false"></div>
      <div class="g_id_signin" data-type="standard" data-size="large"
           data-theme="outline" data-text="signin_with" data-shape="rectangular"
           data-logo_alignment="left"></div>
      <p id="estado-login" role="status">Entre com o Google para habilitar a geração.</p>
    </section>

    <section class="cartao">
      <h2>2. Gere o desenho</h2>
      <form id="formulario" novalidate>
        <label for="numero">Número inteiro entre 1 e 100</label>
        <input id="numero" name="numero" type="number" min="1" max="100" step="1"
               required placeholder="42">
        <button id="gerar" type="submit" disabled>Gerar desenho</button>
      </form>
      <p id="mensagem" role="alert"></p>
    </section>

    <figure id="desenho" aria-live="polite"></figure>
    <button id="baixar" type="button" hidden>Baixar SVG</button>
  </main>
  <script src="/app.js"></script>
</body>
</html>
